# Fabrique l'appli Android (APK) à chaque mise à jour. Deux canaux :
#  - développement (chaque mise à jour) : https://github.com/YMCA-dev-wow/radar-roches/releases/download/appli-dev/radar-roches.apk
#  - testeurs (seulement si le message du commit contient « [publier] », ou lancement manuel avec « publier ») :
#    https://github.com/YMCA-dev-wow/radar-roches/releases/latest/download/radar-roches.apk
# Une publication testeurs met aussi à jour le canal de développement (il a toujours la version la plus récente).
# Copié dans .github/workflows/ du dépôt par outils/preparer_site.py.
name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publier:
        description: Publier pour les testeurs
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Canal (développement ou testeurs)
        env:
          MSG: ${{ github.event.head_commit.message }}
          PUBLIER: ${{ github.event.inputs.publier }}
        run: |
          if [ "$PUBLIER" = "true" ] || printf '%s' "$MSG" | grep -qiF '[publier]'; then C=testeurs; else C=dev; fi
          echo "CANAL=$C" >> "$GITHUB_ENV"; echo "Canal : $C"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # cache de Gradle (distribution et dépendances) : un build ne dépend plus des serveurs de Gradle à chaque fois
      - uses: gradle/actions/setup-gradle@v4

      - name: Dépendances et pages web
        working-directory: appli
        run: |
          npm ci --no-audit --no-fund
          node copier_www.js
          npx cap sync android

      - name: Clé de signature (secrets du dépôt)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/radar.p12"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/radar.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_B64 absent : APK de test (signature provisoire, mises à jour impossibles sans désinstaller)"
          fi

      - name: Construction
        working-directory: appli/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          TACHE=assembleDebug; SORTIE=debug/app-debug.apk
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then TACHE=assembleRelease; SORTIE=release/app-release.apk; fi
          set +e
          # jusqu'à 3 essais : pannes réseau passagères (téléchargement de Gradle ou des dépendances)
          for ESSAI in 1 2 3; do
            ./gradlew $TACHE --no-daemon --console=plain > "$RUNNER_TEMP/gradle.log" 2>&1
            CODE=$?
            if [ $CODE -eq 0 ] || ! grep -qE 'SocketTimeoutException|timed out|Server returned HTTP response code: 5|Could not GET|Could not resolve|Connection reset' "$RUNNER_TEMP/gradle.log"; then break; fi
            echo "Essai $ESSAI : erreur réseau, nouvel essai dans 60 s"; sleep 60
          done
          set -e
          tail -n 60 "$RUNNER_TEMP/gradle.log"
          if [ $CODE -ne 0 ]; then
            # erreurs reprises en annotations (lisibles sans être connecté)
            enc() { sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
            echo "::error title=Gradle (cause)::$(grep -A 20 'What went wrong' "$RUNNER_TEMP/gradle.log" | head -n 40 | enc)"
            echo "::error title=Gradle (erreurs)::$(grep -E '\.java:[0-9]+|error:|Execution failed|Could not|Caused by|warning:.*deprecated' "$RUNNER_TEMP/gradle.log" | head -n 30 | enc)"
            echo "::error title=Gradle (tâches)::$(grep -E '^> Task' "$RUNNER_TEMP/gradle.log" | tail -n 8 | enc)"
            exit $CODE
          fi
          cp "app/build/outputs/apk/$SORTIE" "$RUNNER_TEMP/radar-roches.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: radar-roches-apk
          path: ${{ runner.temp }}/radar-roches.apk

      - name: Version affichée
        run: echo "VERSION_APPLI=$(node -e "const v=require('./appli/version.json');console.log(v.generation+'.'+v.jalon)")" >> "$GITHUB_ENV"

      - name: Publication (canal de développement)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: appli-dev
          name: Radar roches – version de développement
          prerelease: true
          make_latest: false
          body: |
            Version de développement, mise à jour à chaque modification : version ${{ env.VERSION_APPLI }} (construction n° ${{ github.run_number }}).
            Télécharger : https://github.com/${{ github.repository }}/releases/download/appli-dev/radar-roches.apk
          files: ${{ runner.temp }}/radar-roches.apk

      - name: Publication (canal testeurs)
        if: env.CANAL == 'testeurs'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: appli
          name: Radar roches – appli Android
          body: |
            Appli Android du radar, version ${{ env.VERSION_APPLI }} (construction n° ${{ github.run_number }}).
            Télécharger depuis le téléphone : https://github.com/${{ github.repository }}/releases/latest/download/radar-roches.apk
            Sécurité (empreintes, analyse antivirus) : https://ymca-dev-wow.github.io/radar-roches/securite.html
          files: ${{ runner.temp }}/radar-roches.apk
          make_latest: true

      # Analyse antivirus : l'APK est envoyée à VirusTotal (plus de 70 antivirus) si la clé d'API est fournie dans les
      # secrets du dépôt (VIRUSTOTAL_API_KEY, compte VirusTotal gratuit). Le rapport est public, retrouvé par l'empreinte
      # SHA-256 de l'APK (page securite.html). Sans clé : étape ignorée ; un échec n'empêche pas la publication.
      - name: Analyse VirusTotal
        if: env.CANAL == 'testeurs'
        continue-on-error: true
        env:
          VT: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          sha256sum "$RUNNER_TEMP/radar-roches.apk"
          if [ -z "$VT" ]; then echo "Pas de clé VIRUSTOTAL_API_KEY : analyse non envoyée"; exit 0; fi
          curl -sS --fail --request POST --url https://www.virustotal.com/api/v3/files \
            --header "x-apikey: $VT" --form "file=@$RUNNER_TEMP/radar-roches.apk" | head -c 400
